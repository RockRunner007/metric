<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>GHAS Metrics Demo</title>
    <style>
      :root { color-scheme: dark; }
      body { font-family: Inter, Arial, sans-serif; margin: 2rem; line-height: 1.5; color: #f3f4f6; background: linear-gradient(135deg, #0f172a, #111827); }
      .card { border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; background: rgba(15, 23, 42, 0.82); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
      .metric { background: rgba(255,255,255,0.06); padding: 0.8rem; border-radius: 10px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid rgba(255,255,255,0.14); padding: 0.6rem; text-align: left; }
      code { background: rgba(255,255,255,0.09); padding: 0.12rem 0.3rem; border-radius: 4px; }
      a { color: #93c5fd; }
      .pill { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 999px; background: #1d4ed8; font-size: 0.8rem; margin-top: 0.25rem; }
      .status { font-size: 0.85rem; color: #cbd5e1; }
      .status-configured { color: #4ade80; }
      .status-pending { color: #fbbf24; }
      .status-findings { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>GitHub Advanced Security Metrics Demo</h1>
    <p>Repository-wide findings from the latest workflow run.</p>
    <p>
      <a href="./data/ghas_metrics.csv">Download CSV</a> |
      <a href="./data/ghas_metrics.json">View JSON</a>
    </p>

    <div class="card">
      <h2>Security posture overview</h2>
      <div class="grid" id="summary"></div>
    </div>

    <div class="card">
      <h2>Highest-risk repositories</h2>
      <table>
        <thead>
          <tr><th>Repository</th><th>Code scanning</th><th>Critical</th><th>High</th><th>Medium</th><th>Dependabot</th><th>Secret scanning</th></tr>
        </thead>
        <tbody id="repos"></tbody>
      </table>
    </div>

    <script>
      const dataUrl = new URL('./data/ghas_metrics.json', window.location.href);
      dataUrl.searchParams.set('v', Date.now());

      fetch(dataUrl.toString(), { cache: 'no-store' })
        .then((response) => response.json())
        .then((data) => {
          const rows = Array.isArray(data.rows) ? data.rows : [];
          const summary = document.getElementById('summary');
          const repos = document.getElementById('repos');

          const totals = {
            repositories: data.repositories_scanned || rows.length,
            withFindings: data.repositories_with_findings || rows.filter((row) => row && (Number(row.code_scanning_open) || Number(row.dependabot_open) || Number(row.secret_scanning_open))).length,
            findings: data.total_findings || rows.reduce((sum, row) => sum + (Number(row.code_scanning_open) || 0) + (Number(row.dependabot_open) || 0) + (Number(row.secret_scanning_open) || 0), 0),
            codeScanning: data.total_code_scanning_open || rows.reduce((sum, row) => sum + (Number(row.code_scanning_open) || 0), 0),
            critical: data.total_code_scanning_critical || rows.reduce((sum, row) => sum + (Number(row.code_scanning_critical) || 0), 0),
            high: data.total_code_scanning_high || rows.reduce((sum, row) => sum + (Number(row.code_scanning_high) || 0), 0),
            medium: data.total_code_scanning_medium || rows.reduce((sum, row) => sum + (Number(row.code_scanning_medium) || 0), 0),
            dependabot: data.total_dependabot_open || rows.reduce((sum, row) => sum + (Number(row.dependabot_open) || 0), 0),
            secrets: data.total_secret_scanning_open || rows.reduce((sum, row) => sum + (Number(row.secret_scanning_open) || 0), 0),
          };

          summary.innerHTML = [
            ['Repositories', totals.repositories],
            ['Configured', data.repositories_configured || 0],
            ['Pending', data.repositories_pending || 0],
            ['With alerts', data.repositories_with_alerts || 0],
            ['With findings', totals.withFindings],
            ['Total findings', totals.findings],
            ['Code scanning', totals.codeScanning],
            ['Critical', totals.critical],
            ['High', totals.high],
            ['Medium', totals.medium],
            ['Dependabot', totals.dependabot],
            ['Secret scanning', totals.secrets],
          ].map(([label, value]) => `<div class="metric"><strong>${label}</strong><div>${value}</div><div class="pill">Live</div></div>`).join('');

          const updated = document.createElement('p');
          updated.textContent = `Updated: ${data.fetched_at || 'n/a'}`;
          updated.style.marginTop = '0.75rem';
          updated.style.color = '#cbd5e1';
          summary.parentNode.insertBefore(updated, summary.nextSibling);

          const topRows = (data.top_repositories || rows)
            .filter((row) => row && row.repository)
            .sort((a, b) => ((Number(b.code_scanning_open) || 0) + (Number(b.dependabot_open) || 0) + (Number(b.secret_scanning_open) || 0)) - ((Number(a.code_scanning_open) || 0) + (Number(a.dependabot_open) || 0) + (Number(a.secret_scanning_open) || 0)))
            .slice(0, 10);

          repos.innerHTML = topRows.map((row) => `
            <tr>
              <td><code>${row.repository}</code><div class="status ${row.scan_status === 'findings' ? 'status-findings' : row.scan_status === 'configured' ? 'status-configured' : row.scan_status === 'pending' ? 'status-pending' : ''}">${row.scan_status || 'unknown'}</div></td>
              <td>${row.code_scanning_open || 0}</td>
              <td>${row.code_scanning_critical || 0}</td>
              <td>${row.code_scanning_high || 0}</td>
              <td>${row.code_scanning_medium || 0}</td>
              <td>${row.dependabot_open || 0}</td>
              <td>${row.secret_scanning_open || 0}</td>
            </tr>
          `).join('');
        })
        .catch(() => {
          document.getElementById('summary').innerHTML = '<div class="metric">Metrics are not available yet.</div>';
          document.getElementById('repos').innerHTML = '<tr><td colspan="7">Run the workflow once to generate the demo data.</td></tr>';
        });
    </script>
  </body>
</html>
