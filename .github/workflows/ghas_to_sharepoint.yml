name: Sync GHAS Metrics to SharePoint

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run GHAS metrics collection
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ORG_NAME: ${{ github.repository_owner }}
          SP_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SP_SITE_URL: ${{ secrets.SHAREPOINT_SITE_URL }}
          SP_MOCK_MODE: true
        run: |
          python3 .github/scripts/fetch_and_push.py
          python3 - <<'PY'
          from pathlib import Path
          import os
          from importlib.machinery import SourceFileLoader

          script = SourceFileLoader('fetch_and_push', str(Path('.github/scripts/fetch_and_push.py'))).load_module()
          try:
              metrics = script.get_ghas_metrics() if os.getenv('GH_PAT') and os.getenv('GH_ORG_NAME') else {
                  'organization': os.getenv('GH_ORG_NAME', 'demo'),
                  'fetched_at': script.datetime.now(script.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'rows': []
              }
          except Exception as exc:
              metrics = {
                  'organization': os.getenv('GH_ORG_NAME', 'demo'),
                  'fetched_at': script.datetime.now(script.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'rows': [],
                  'error': str(exc),
              }
          script.write_pages_artifacts(metrics, Path('docs/data'))
          PY

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghas-metrics
          path: |
            ghas_metrics.json
            ghas_metrics.csv
            docs/data/ghas_metrics.json
            docs/data/ghas_metrics.csv
            docs/index.html
          if-no-files-found: warn

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
