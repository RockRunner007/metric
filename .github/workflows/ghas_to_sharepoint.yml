name: Sync GHAS Metrics to SharePoint

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GHAS metrics collection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_ORG_NAME: ${{ github.repository_owner }}
          SP_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SP_SITE_URL: ${{ secrets.SHAREPOINT_SITE_URL }}
          SP_MOCK_MODE: false
        run: |
          python3 .github/scripts/fetch_and_push.py
          echo "Metrics collection completed and Pages artifacts were updated."

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghas-metrics
          path: |
            ghas_metrics.json
            ghas_metrics.csv
            columns.json
            tickets.csv
            docs/data/ghas_metrics.json
            docs/data/ghas_metrics.csv
            docs/data/columns.json
            docs/data/tickets.csv
            docs/index.html
          if-no-files-found: warn

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
